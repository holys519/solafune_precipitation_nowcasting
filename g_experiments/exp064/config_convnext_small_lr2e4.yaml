experiment:
  name: exp064_convnext_small_lr2e4
  description: "2026-07-30 addition: exp064_convnext_lr2e4 (convnext_tiny, lr=2e-4) fixed the lr=1e-3 NaN-divergence but only tied the champion baseline on fold0/4 -- a clean, unpromising gate result. However, 2026-07-30 also showed the fold0/4 gate badly UNDERESTIMATED exp064_effb3/effv2s's true 5-fold LB performance (see doc/plan/round8_campaign_2026-07-27.md's 2026-07-30 update), so a 'tie' on this gate is no longer strong evidence of no value -- especially for convnext, the architecturally most distinct CNN family tried (vs. the EfficientNet-family effb3/effv2s/effb4). This config scales convnext_tiny -> convnext_small (one size up, same family) at the same lr=2e-4/reduce_on_plateau regime that already fixed convnext_tiny's NaN issue, testing whether the tie was a capacity ceiling (small helps) or a genuine architecture-fit ceiling (small doesn't help either)."
  seed: 42

data:
  train_csv: ../../data/train_dataset/train_dataset.csv
  evaluation_csv: ../../data/evaluation_dataset/evaluation_target.csv
  train_dir: ../../data/train_dataset
  evaluation_dir: ../../data/evaluation_dataset
  sample_submission_dir: ../../data/sample_submission
  max_observations: 3
  context_rows: 1
  satellite_channels: 16
  target_height: 41
  target_width: 41
  drop_zero_obs_rows: true

# Strict-green arm only, unchanged from exp038: raw distributed bands, no successor rows, no
# wavelength-alignment feature engineering. This experiment is a pure architecture ablation --
# input pipeline must stay identical to exp038 so any tile_rmse delta is attributable to the
# mean-intensity/shape factorization, not a feature-engineering confound.
features:
  canonical_bands: false
  engineered: false
  temporal_abs: false
  target_time_first: false
  ir_rain_proxy: false

split:
  strategy: group_kfold
  n_splits: 5
  fold: 0
  max_train_samples: null
  max_valid_samples: null

# Identical regime to exp064_convnext_lr2e4 (the config that fixed the lr=1e-3 NaN divergence).
train:
  batch_size: 128
  epochs: 100
  lr: 0.0002
  weight_decay: 0.0001
  num_workers: 12
  amp: true
  grad_clip_norm: 1.0
  augment: true
  # 2026-07-30: added after confirming exp064_convnext_lr2e4's fold1 history peaks at epoch 2
  # (valid_tile_rmse 0.725) and never improves again through epoch 100 while train_tile_rmse keeps
  # monotonically decreasing (0.592 -> 0.435) -- textbook overfitting. train.py's checkpoint save
  # is synchronous on every validation improvement (not deferred to epoch 100), so the deployed
  # model is unaffected either way -- but running 97 further epochs of pure overfitting past the
  # plateau wasted GPU-hours for zero benefit. patience=20 gives >2 full ReduceLROnPlateau cycles
  # (patience=4 each) to confirm no genuine post-LR-drop recovery before stopping.
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0

scheduler:
  name: reduce_on_plateau
  factor: 0.3
  patience: 4
  min_lr: 1.0e-5

model:
  architecture: pretrained_factorized
  in_channels: 54
  encoder_name: convnext_small
  decoder_channels: 64
  internal_size: 160
  aux_mask_enabled: true
  clip_min: 0.0
  # mean_intensity head: global-average-pooled decoder features -> 2-layer MLP -> softplus.
  mean_intensity_hidden: 64
  shape_eps: 1.0e-6
  amount_cap: 150.0
  bottleneck_dilations: []

loss:
  name: factorized_mean_shape
  rain_threshold: 0.0
  bce_weight: 1.0
  # New terms replacing exp038's joint (mu, sigma) log-normal NLL -- see losses.py docstring.
  # Both can be set to 0 independently to ablate (sane no-crash behavior, verified in smoke_test.py).
  mean_intensity_weight: 1.0
  shape_weight: 1.0
  shape_eps: 1.0e-6
  # Unchanged from exp038 -- same auxiliary-supervision budget, so this stays a pure ablation of
  # the amount-factorization axis.
  aux_mask_weight: 0.2
  aux_mask_threshold: 0.25
  aux_dice_weight: 0.5
  multiscale_weight_2: 0.2
  multiscale_weight_4: 0.1

tta:
  enabled: true
  flip: true

metric:
  selection: tile_rmse

postprocess:
  use_oof_calibration: false
  calibration_mode: linear
  rain_prob_threshold: 0.0
  rain_prob_threshold_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  value_threshold: 0.10
  value_threshold_grid: [0.0, 0.01, 0.03, 0.05, 0.08, 0.10, 0.12, 0.15, 0.20, 0.25]
  temporal_smoothing:
    enabled: false
    center_weight: 0.70
    prev_weight: 0.15
    next_weight: 0.15
    max_gap_minutes: 30
  calibration_path: ../../outputs/analysis/exp064_convnext_small_lr2e4/oof_calibration.json

paths:
  model_dir: ../../g_model/exp064_convnext_small_lr2e4
  output_dir: ../../outputs/submissions/exp064_convnext_small_lr2e4
  submission_zip: ../../outputs/submissions/exp064_convnext_small_lr2e4_submission.zip
  analysis_dir: ../../outputs/analysis/exp064_convnext_small_lr2e4
  norm_stats: norm_stats.json
