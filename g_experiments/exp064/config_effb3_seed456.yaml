experiment:
  name: exp064_effb3_seed456
  description: "2026-07-30 addition: seed-diversity variant of exp064_effb3 (the new green champion, timm efficientnet_b3 pretrained encoder), same architecture/features/split, only training seed differs (456 instead of 42). Mirrors the exp056_seed456 pattern that made exp056_seed_ens_42_456 (a 2-seed average) beat both solo members -- a genuine variance-reduction win from decorrelated training noise on the SAME architecture, previously validated only on the from-scratch CompactUNet family. This tests whether the same seed-ensembling gain transfers to the pretrained-backbone family now that it is the champion."
  seed: 456

data:
  train_csv: ../../data/train_dataset/train_dataset.csv
  evaluation_csv: ../../data/evaluation_dataset/evaluation_target.csv
  train_dir: ../../data/train_dataset
  evaluation_dir: ../../data/evaluation_dataset
  sample_submission_dir: ../../data/sample_submission
  max_observations: 3
  context_rows: 1
  satellite_channels: 16
  target_height: 41
  target_width: 41
  drop_zero_obs_rows: true

# Strict-green arm only, unchanged from exp038: raw distributed bands, no successor rows, no
# wavelength-alignment feature engineering. This experiment is a pure architecture ablation --
# input pipeline must stay identical to exp038 so any tile_rmse delta is attributable to the
# mean-intensity/shape factorization, not a feature-engineering confound.
features:
  canonical_bands: false
  engineered: false
  temporal_abs: false
  target_time_first: false
  ir_rain_proxy: false

split:
  strategy: group_kfold
  n_splits: 5
  fold: 0
  max_train_samples: null
  max_valid_samples: null

# Identical training regime to exp064_effb3 -- only experiment.seed differs, for a clean
# variance-reduction ablation.
train:
  batch_size: 128
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 12
  amp: true
  grad_clip_norm: 1.0
  augment: true
  # 2026-07-30: added from the start this time (see config_effb4.yaml/config_convnext_small_lr2e4.yaml
  # for the postmortem -- exp064_effb3's own fold1 history peaked at epoch 3 of 100 and never
  # improved again; running the full 100 epochs without this wastes ~97 epochs/fold of GPU time
  # for zero benefit, since train.py's checkpoint save is already synchronous on every validation
  # improvement).
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0

model:
  architecture: pretrained_factorized
  in_channels: 54
  encoder_name: efficientnet_b3
  decoder_channels: 64
  internal_size: 160
  aux_mask_enabled: true
  clip_min: 0.0
  # mean_intensity head: global-average-pooled decoder features -> 2-layer MLP -> softplus.
  mean_intensity_hidden: 64
  shape_eps: 1.0e-6
  amount_cap: 150.0
  bottleneck_dilations: []

loss:
  name: factorized_mean_shape
  rain_threshold: 0.0
  bce_weight: 1.0
  # New terms replacing exp038's joint (mu, sigma) log-normal NLL -- see losses.py docstring.
  # Both can be set to 0 independently to ablate (sane no-crash behavior, verified in smoke_test.py).
  mean_intensity_weight: 1.0
  shape_weight: 1.0
  shape_eps: 1.0e-6
  # Unchanged from exp038 -- same auxiliary-supervision budget, so this stays a pure ablation of
  # the amount-factorization axis.
  aux_mask_weight: 0.2
  aux_mask_threshold: 0.25
  aux_dice_weight: 0.5
  multiscale_weight_2: 0.2
  multiscale_weight_4: 0.1

tta:
  enabled: true
  flip: true

metric:
  selection: tile_rmse

postprocess:
  use_oof_calibration: false
  calibration_mode: linear
  rain_prob_threshold: 0.0
  rain_prob_threshold_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  value_threshold: 0.10
  value_threshold_grid: [0.0, 0.01, 0.03, 0.05, 0.08, 0.10, 0.12, 0.15, 0.20, 0.25]
  temporal_smoothing:
    enabled: false
    center_weight: 0.70
    prev_weight: 0.15
    next_weight: 0.15
    max_gap_minutes: 30
  calibration_path: ../../outputs/analysis/exp064_effb3_seed456/oof_calibration.json

paths:
  model_dir: ../../g_model/exp064_effb3_seed456
  output_dir: ../../outputs/submissions/exp064_effb3_seed456
  submission_zip: ../../outputs/submissions/exp064_effb3_seed456_submission.zip
  analysis_dir: ../../outputs/analysis/exp064_effb3_seed456
  norm_stats: norm_stats.json
