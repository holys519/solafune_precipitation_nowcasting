experiment:
  name: exp064_effb4
  description: "2026-07-30 addition: exp064_effb3 (timm efficientnet_b3 pretrained encoder) overturned its own fold0/4 'mixed' gate verdict and became the new green champion on the full 5-fold LB (0.6720097338314985, -0.01076 vs the prior champion) -- see doc/public_scores.md 2026-07-30 追記5 and doc/plan/round8_campaign_2026-07-27.md's 2026-07-30 update, which retracted this experiment's own prior 'capacity is not the bottleneck' conclusion. This config tests the natural next question directly: does scaling within the SAME winning encoder family (effb3 -> effb4, one size up) continue to help, now that the fold0/4 gate is known to be unreliable for this axis and the fair test is the full 5-fold LB. Same training regime/lr as effb3 (EfficientNet family showed no NaN risk at lr=1e-3, unlike convnext/swin) so any tile_rmse delta is attributable to encoder capacity, not an optimizer-regime confound."
  seed: 42

data:
  train_csv: ../../data/train_dataset/train_dataset.csv
  evaluation_csv: ../../data/evaluation_dataset/evaluation_target.csv
  train_dir: ../../data/train_dataset
  evaluation_dir: ../../data/evaluation_dataset
  sample_submission_dir: ../../data/sample_submission
  max_observations: 3
  context_rows: 1
  satellite_channels: 16
  target_height: 41
  target_width: 41
  drop_zero_obs_rows: true

# Strict-green arm only, unchanged from exp038: raw distributed bands, no successor rows, no
# wavelength-alignment feature engineering. This experiment is a pure architecture ablation --
# input pipeline must stay identical to exp038 so any tile_rmse delta is attributable to the
# mean-intensity/shape factorization, not a feature-engineering confound.
features:
  canonical_bands: false
  engineered: false
  temporal_abs: false
  target_time_first: false
  ir_rain_proxy: false

split:
  strategy: group_kfold
  n_splits: 5
  fold: 0
  max_train_samples: null
  max_valid_samples: null

# Identical training regime to exp064_effb3 for a fair encoder-capacity comparison.
train:
  batch_size: 128
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 12
  amp: true
  grad_clip_norm: 1.0
  augment: true
  # 2026-07-30: added after confirming exp064_effb3/exp064_convnext_lr2e4's fold1 histories both
  # peak at epoch 2-3 (valid_tile_rmse) and never improve again in the remaining ~97 epochs while
  # train_tile_rmse keeps monotonically decreasing -- textbook overfitting, and the champion's own
  # `best_model_fold*.pt` selection already only ever uses the pre-overfit checkpoint (train.py
  # saves synchronously on every validation improvement, not at epoch 100), so running past the
  # plateau bought nothing but wasted GPU-hours. patience=20 gives >2 full ReduceLROnPlateau
  # cycles (patience=4 each) to confirm no genuine post-LR-drop recovery before stopping, matching
  # the safety margin the historical curves actually showed.
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0

model:
  architecture: pretrained_factorized
  in_channels: 54
  encoder_name: efficientnet_b4
  decoder_channels: 64
  internal_size: 160
  aux_mask_enabled: true
  clip_min: 0.0
  # mean_intensity head: global-average-pooled decoder features -> 2-layer MLP -> softplus.
  mean_intensity_hidden: 64
  shape_eps: 1.0e-6
  amount_cap: 150.0
  bottleneck_dilations: []

loss:
  name: factorized_mean_shape
  rain_threshold: 0.0
  bce_weight: 1.0
  # New terms replacing exp038's joint (mu, sigma) log-normal NLL -- see losses.py docstring.
  # Both can be set to 0 independently to ablate (sane no-crash behavior, verified in smoke_test.py).
  mean_intensity_weight: 1.0
  shape_weight: 1.0
  shape_eps: 1.0e-6
  # Unchanged from exp038 -- same auxiliary-supervision budget, so this stays a pure ablation of
  # the amount-factorization axis.
  aux_mask_weight: 0.2
  aux_mask_threshold: 0.25
  aux_dice_weight: 0.5
  multiscale_weight_2: 0.2
  multiscale_weight_4: 0.1

tta:
  enabled: true
  flip: true

metric:
  selection: tile_rmse

postprocess:
  use_oof_calibration: false
  calibration_mode: linear
  rain_prob_threshold: 0.0
  rain_prob_threshold_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  value_threshold: 0.10
  value_threshold_grid: [0.0, 0.01, 0.03, 0.05, 0.08, 0.10, 0.12, 0.15, 0.20, 0.25]
  temporal_smoothing:
    enabled: false
    center_weight: 0.70
    prev_weight: 0.15
    next_weight: 0.15
    max_gap_minutes: 30
  calibration_path: ../../outputs/analysis/exp064_effb4/oof_calibration.json

paths:
  model_dir: ../../g_model/exp064_effb4
  output_dir: ../../outputs/submissions/exp064_effb4
  submission_zip: ../../outputs/submissions/exp064_effb4_submission.zip
  analysis_dir: ../../outputs/analysis/exp064_effb4
  norm_stats: norm_stats.json
