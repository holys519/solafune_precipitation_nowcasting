experiment:
  name: exp064_swin_small_lr2e4
  description: "2026-07-31 addition: within-family capacity scale-up test for the Swin encoder (swin_tiny -> swin_small), same lr=2e-4 + reduce_on_plateau regime that avoided NaN divergence for swin_tiny. Motivated distinctly from the exp064_effb4/exp064_convnext_small_lr2e4 result (both worse than their smaller siblings, closing 'within-family scale-up' for the EfficientNet/ConvNeXt families): swin_tiny is the only exp064 arm that both cleanly PASSED the fold0/4 gate and won on full 5-fold LB (0.6704384663890527, 2nd best solo), so whether capacity scaling helps specifically for the Swin family is still an open, untested question, not a retread of the closed EfficientNet/ConvNeXt axis. swin_small keeps the same per-stage channel dims as swin_tiny (embed_dim=96, only stage depths differ: [2,2,18,2] vs [2,2,6,2]), so PretrainedFactorizedUNet's features_only decoder is shape-compatible without changes. early_stopping_patience added from the start per the exp064_effb4/exp064_convnext_small_lr2e4 postmortem (fold1 histories there peaked at epoch 2-3 of 100 and never improved again)."
  seed: 42

data:
  train_csv: ../../data/train_dataset/train_dataset.csv
  evaluation_csv: ../../data/evaluation_dataset/evaluation_target.csv
  train_dir: ../../data/train_dataset
  evaluation_dir: ../../data/evaluation_dataset
  sample_submission_dir: ../../data/sample_submission
  max_observations: 3
  context_rows: 1
  satellite_channels: 16
  target_height: 41
  target_width: 41
  drop_zero_obs_rows: true

# Strict-green arm only, unchanged from exp038: raw distributed bands, no successor rows, no
# wavelength-alignment feature engineering. This experiment is a pure architecture ablation --
# input pipeline must stay identical to exp038 so any tile_rmse delta is attributable to the
# mean-intensity/shape factorization, not a feature-engineering confound.
features:
  canonical_bands: false
  engineered: false
  temporal_abs: false
  target_time_first: false
  ir_rain_proxy: false

split:
  strategy: group_kfold
  n_splits: 5
  fold: 0
  max_train_samples: null
  max_valid_samples: null

train:
  batch_size: 128
  epochs: 100
  lr: 0.0002
  weight_decay: 0.0001
  num_workers: 12
  amp: true
  grad_clip_norm: 1.0
  augment: true
  # 2026-07-31: added from the start -- see exp064_effb4/exp064_convnext_small_lr2e4 postmortem
  # (train.py's checkpoint save is already synchronous on every validation improvement, so this
  # only saves wasted epochs, never correctness).
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0

scheduler:
  name: reduce_on_plateau
  factor: 0.3
  patience: 4
  min_lr: 1.0e-5

model:
  architecture: pretrained_factorized
  in_channels: 54
  encoder_name: swin_small_patch4_window7_224
  decoder_channels: 64
  internal_size: 224
  aux_mask_enabled: true
  clip_min: 0.0
  # mean_intensity head: global-average-pooled decoder features -> 2-layer MLP -> softplus.
  mean_intensity_hidden: 64
  shape_eps: 1.0e-6
  amount_cap: 150.0
  bottleneck_dilations: []

loss:
  name: factorized_mean_shape
  rain_threshold: 0.0
  bce_weight: 1.0
  # New terms replacing exp038's joint (mu, sigma) log-normal NLL -- see losses.py docstring.
  # Both can be set to 0 independently to ablate (sane no-crash behavior, verified in smoke_test.py).
  mean_intensity_weight: 1.0
  shape_weight: 1.0
  shape_eps: 1.0e-6
  # Unchanged from exp038 -- same auxiliary-supervision budget, so this stays a pure ablation of
  # the amount-factorization axis.
  aux_mask_weight: 0.2
  aux_mask_threshold: 0.25
  aux_dice_weight: 0.5
  multiscale_weight_2: 0.2
  multiscale_weight_4: 0.1

tta:
  enabled: true
  flip: true

metric:
  selection: tile_rmse

postprocess:
  use_oof_calibration: false
  calibration_mode: linear
  rain_prob_threshold: 0.0
  rain_prob_threshold_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  value_threshold: 0.10
  value_threshold_grid: [0.0, 0.01, 0.03, 0.05, 0.08, 0.10, 0.12, 0.15, 0.20, 0.25]
  temporal_smoothing:
    enabled: false
    center_weight: 0.70
    prev_weight: 0.15
    next_weight: 0.15
    max_gap_minutes: 30
  calibration_path: ../../outputs/analysis/exp064_swin_small_lr2e4/oof_calibration.json

paths:
  model_dir: ../../g_model/exp064_swin_small_lr2e4
  output_dir: ../../outputs/submissions/exp064_swin_small_lr2e4
  submission_zip: ../../outputs/submissions/exp064_swin_small_lr2e4_submission.zip
  analysis_dir: ../../outputs/analysis/exp064_swin_small_lr2e4
  norm_stats: norm_stats.json
